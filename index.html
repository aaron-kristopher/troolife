<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TrooLife</title>
    <link rel="stylesheet" href="css/styles.css">

    <!--BOOTSTRAP-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

    <!--GOOGLE FONTS-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body>

    <!--START NAVBAR -->
    <nav class="navbar justify-content-center navbar-expand-lg fixed-top navbar-dark nav-sticky" id="navbar">
        <div class="container-fluid px-3 px-xxl-5 py-2">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse"
                aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
                <img src="images/icons/menu.svg">
            </button>

            <a class="navbar-brand m-0" href="#">
                <img class="h-25" src="images/logo.svg" alt="Troolife">
            </a>

            <ul class="text-end nav order-lg-2">
                <li class="mx-1 nav-item">
                    <a href="#">
                        <img class="mb-1" src="images/icons/shopping_cart.svg" alt="cart">
                    </a>
                </li>
                <li class="d-none d-md-inline px-2 mx-1 nav-item">
                    <img class="mb-1" src="images/icons/line.png">
                </li>
                <li class="d-none d-xl-inline px-2 mx-1 nav-item">
                    <a href="#">
                        <img class="mb-1 pe-1" src="images/icons/account_circle.svg" alt="profile">
                        <span class="d-none d-lg-inline">My Office</span>
                    </a>
                </li>
                <li class="ps-2 ms-0 ms-sm-1 nav-item">
                    <a href="#">
                        <img class="mb-1 pe-1" src="images/icons/language.svg" alt="language">
                        <span>English</span>
                        <img class="pb-1 ps-1" src="images/icons/dropdown.svg" alt="dropdown">
                    </a>
                </li>
            </ul>

            <div class="collapse navbar-collapse" id="navbarCollapse">
                <ul class="navbar-nav mx-auto" id="navbar-navlist">
                    <li class="nav-item px-2">
                        <a data-scroll class="nav-link" href="#mission">Mission</a>
                    </li>
                    <li class="nav-item px-2">
                        <a data-scroll class="nav-link" href="#lifeline">LifeLine</a>
                    </li>
                    <li class="nav-item px-2">
                        <a data-scroll class="nav-link" href="#nutrition">Nutrition</a>
                    </li>
                    <li class="nav-item px-2">
                        <a data-scroll class="nav-link" href="#referral">Free by Referral </a>
                    </li>
                    <li class="nav-item px-2">
                        <a data-scroll class="nav-link" href="#relatins">Relations</a>
                    </li>
                    <li class="nav-item px-2">
                        <a data-scroll class="nav-link" href="#company">Company</a>
                    </li>
                    <li class="nav-item px-2">
                        <a data-scroll class="nav-link" href="#management">Management</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <!--END OF NAVBAR-->

    <!--START OF MEMBER BLOCK-->
    <div class="container-fluid px-sm-5 d-flex align-items-center justify-content-between" id="member-block">
        <div class="d-flex align-items-center">
            <img src="images/icons/Ellipse.png" height="55" alt="profile">
            <p class="mb-0 ps-3" id="member-name">Amanda Jones</p>
        </div>
        <div class="d-flex align-items-center">
            <img src="images/icons/contact.svg" alt="contact">
            <img class="ps-3" src="images/icons/messages.svg" alt="messages">
        </div>
    </div>

    <!--END OF MEMBER BLOCK-->

    <!--START OF HERO-->
    <div class="d-flex align-items-center justify-content-center w-100 vh-100" id="hero">
        <div class="content col-5 align-items-center text-center">
            <h1 class="pb-4">TrooLife is dedicated to enhancing the quality and longevity of lives</h1>
            <a href="#">Find out why <span><img src="images/icons/right_caret.svg"></span></a>
        </div>
        <video autoplay loop plays-inline muted class="background-clip">
            <source src="images/hero.mp4" type="video/mp4">
        </video>
    </div>
    <!--END OF HERO-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
</body>

</html>
